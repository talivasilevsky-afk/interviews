const Q = {

/* ================= helpers ================= */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hasVal(v){ if (v===undefined||v===null||v===false) return false; if (Array.isArray(v)) return v.length>0; return String(v).trim()!==''; }
function pct(a, b){ return b ? Math.round(100*a/b) : 0; }
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html!==undefined) e.innerHTML = html; return e; }
function fmtTime(ms){ try { return new Date(ms).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch(e){ return new Date(ms).toISOString(); } }
function fmtDur(sec){ if (!sec) return '–'; const m = Math.round(sec/60); return m < 1 ? `${sec}s` : `${m} min`; }
function isOwner(r){ return r.role==='owner' || r.role==='partner'; }
function isEmp(r){ return r.role==='employee'; }
function onlySource(){ return state.sources.length === 1 ? state.sources[0] : null; }
function fx(text, src){ const ex = EX[src || onlySource()] || NEUTRAL; return String(text).replace(/\{(\w+)\}/g, (m, k) => ex[k] !== undefined ? ex[k] : m); }
function lab(field, v, src){
  v = String(v);
  if (field === 'workplace'){
    const s = src || onlySource();
    if (s && WORKPLACE[s] && WORKPLACE[s][v]) return WORKPLACE[s][v];
    if (v === 'inhouse') return 'In-house — at a company outside the field';
    if (v === 'solo') return 'Solo — independent / freelancer';
    for (const k of SRC_ORDER){ if (WORKPLACE[k] && WORKPLACE[k][v]) return WORKPLACE[k][v]; }
  }
  if (field === 'emp_role' && v === 'craft'){ const s = src || onlySource(); return s ? CRAFT[s] : 'Professional in the field (consultant / marketer / architect…)'; }
  if (field === 'spend_pm_monthly' || field === 'spend_ai_monthly') field = 'spend';
  const m = L[field];
  return fx((m && m[v]) || v.replace(/_/g,' '), src);
}
function srcLabel(s){ return (SRC[s] && SRC[s].label) || s; }
function areaName(key, src, emp){
  if (PMI_BY[key]) return fx((emp && PMI_BY[key].emp) || PMI_BY[key].label, src);
  if (AREA_BY[key]) return (emp && AREA_BY[key].emp) || AREA_BY[key].owner;
  return key;
}
function areaShort(key){ return (PMI_BY[key] && PMI_BY[key].short) || (AREA_BY[key] && AREA_BY[key].short) || key; }
/* Owners answer "Me" and employees "The owner": both mean the owner handles it. */
function handlerKey(v, emp){ if (v==='you') return 'owner_partner'; if (v==='owner') return 'owner_partner'; if (v==='self') return emp ? 'employee_self' : 'owner_partner'; return v; }

/* ================= sessions ================= */
const NOT_ANSWERS = new Set(['_date','_partial','_source','_ts','_replyto','_subject','screen','completed','completed_at','calendly_clicked','clicked_at',
  'exit_email','report_email','meeting_email','vip_qualified','duration_sec','session_id','survey_version','survey_round','tools_shown']);
function rowFrom(sub){
  const r = Object.assign({}, sub);
  const t = Date.parse(r._date || '');
  r._ts = isNaN(t) ? 0 : t;
  MULTI_FIELDS.forEach(f => { if (typeof r[f]==='string') r[f] = r[f].split(',').map(s => s.trim()).filter(Boolean); });
  return r;
}
function mergeSessions(rows){
  const groups = new Map(); let noSession = 0;
  rows.forEach(r => {
    if (!hasVal(r.session_id)){ noSession++; return; }
    const k = r._source + '|' + String(r.session_id).trim();
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  const sessions = [];
  groups.forEach(rs => {
    rs.sort((a, b) => a._ts - b._ts);
    const src = rs[0]._source, sid = String(rs[0].session_id).trim();
    const s = { id: sid, source: src, rowCount: rs.length, firstTs: rs[0]._ts, lastTs: rs[rs.length-1]._ts };
    // Latest non-empty answer wins per question; a later blank never erases an earlier answer.
    rs.forEach(r => Object.keys(r).forEach(f => { if (!NOT_ANSWERS.has(f) && hasVal(r[f])) s[f] = r[f]; }));
    const full = rs.filter(r => hasVal(r.screen));
    s.lastScreen = full.length ? String(full[full.length-1].screen) : null;
    s.tools_shown = (full.length && full[full.length-1].tools_shown) || [];
    s.vip = full.length ? full[full.length-1].vip_qualified === true : false;
    s.calendly = rs.some(r => r.calendly_clicked === true);
    const lastOf = f => { const w = rs.filter(r => typeof r[f] === 'string' && r[f].includes('@')); return w.length ? { email: w[w.length-1][f].trim(), ts: w[w.length-1]._ts } : null; };
    s.reportEmail = lastOf('report_email'); s.exitEmail = lastOf('exit_email'); s.meetingEmail = lastOf('meeting_email');
    s.durationSec = Math.max(0, ...rs.map(r => Number(r.duration_sec) || 0));
    s.screenedOut = hasVal(s.exit_reason);
    s.complete = !s.screenedOut && rs.some(r => r.completed === true);
    s.isTest = (LAUNCH[src] != null && s.firstTs < LAUNCH[src]) || TEST_SESSION_IDS.has(sid);
    s.deepDives = [];
    [1,2,3].forEach(n => {
      const key = s['area'+n+'_key'];
      if (hasVal(key)) s.deepDives.push({ n, key, handler: s['area'+n+'_handler'] ? handlerKey(s['area'+n+'_handler'], isEmp(s)) : null,

    });
    sessions.push(s);
  });
  return { sessions, noSession };
}

function countsFor(field, rows, opts){
  opts = opts || {};
  const map = new Map(); let n = 0;
  rows.forEach(r => {
    const v = opts.get ? opts.get(r) : r[field];
    if (!hasVal(v)) return;
    n++;
    (Array.isArray(v) ? v : [String(v)]).forEach(x => map.set(x, (map.get(x)||0) + 1));
  });
  const order = opts.order || ORDER[field];
  let arr = [...map.entries()].map(([key, count]) => ({ key, name: opts.label ? opts.label(key) : lab(field, key), count }));
  if (order) arr.sort((a, b) => { const ia = order.indexOf(a.key), ib = order.indexOf(b.key); return (ia<0?99:ia) - (ib<0?99:ib); });
  else arr.sort((a, b) => (['other','none','notsure'].includes(a.key) - ['other','none','notsure'].includes(b.key)) || b.count - a.count || a.name.localeCompare(b.name));
  return { counts: arr, n };
}
function insightSentence(counts, n, who, multi){
  if (!n || !counts.length) return null;
  const pool = counts.filter(c => !['notsure','other','none','not_my_call','not_my_area'].includes(c.key));
  const sorted = (pool.length ? pool : counts).slice().sort((a, b) => b.count - a.count);
  const top = sorted[0], ties = sorted.filter(c => c.count === top.count), p = pct(top.count, top.denom || n);
  if (ties.length > 3) return `No single answer leads yet: ${ties.length} answers are tied at ${p}%.`;
  if (ties.length > 1) return `${ties.length} answers are tied at ${p}% each: ${ties.map(t => '<b>“' + esc(t.name) + '”</b>').join(', ')}.`;
  return `<b>“${esc(top.name)}”</b> leads — ${multi ? 'picked' : 'chosen'} by <b>${p}%</b> of the ${top.denom || n} ${who || 'who answered'}.`;
}
function renderBarList(container, counts, n, opts){
  opts = opts || {};

  const val = c => c.denom != null ? c.count / (c.denom || 1) : c.count;

  counts.forEach(c => {
    const denom = c.denom != null ? c.denom : n;

    fill.style.width = Math.max(2, Math.round(100 * val(c) / max)) + '%';
    track.appendChild(fill); row.appendChild(track);
    row.appendChild(el('div','bl-val', c.valText || (c.denom != null ? `${c.count}/${denom} · ${pct(c.count, denom)}%` : `${c.count} · ${pct(c.count, n)}%`)));
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

/* 1–7 ratings in three bands; "Not part of our work" is counted separately. */
const BANDS = [
  { label:'Not frustrating (1–3)', vals:[1,2,3], color:'var(--scale-low)' },
  { label:'Neutral (4)', vals:[4], color:'var(--mark-muted)' },
  { label:'Frustrating (5–7)', vals:[5,6,7], color:'var(--scale-high)' },
];
function likertStats(items, rows){
  return items.map(it => {
    const vals = rows.map(r => Number(r[it.field])).filter(v => v >= 1 && v <= 7);
    const na = rows.filter(r => r[it.field] === 'na').length;
    const dist = [0,0,0,0,0,0,0,0]; vals.forEach(v => dist[v]++);
    const n = vals.length, mean = n ? vals.reduce((a, b) => a + b, 0) / n : 0;
    return { field: it.field, name: it.name, short: it.short, n, na, mean, dist, high: dist[5] + dist[6] + dist[7] };
  }).filter(x => x.n + x.na > 0).sort((a, b) => b.mean - a.mean || b.high - a.high);
}
function renderLikert(container, stats, who){
  if (!stats.length){ container.appendChild(el('div','empty-state','No ratings in this segment yet.')); return; }
  const legend = el('div','lk-legend');
  BANDS.forEach(bd => legend.appendChild(el('span','', `<i style="background:${bd.color}"></i>${esc(bd.label)}`)));
  container.appendChild(legend);
  stats.forEach(it => {
    const row = el('div','lkrow');
    row.appendChild(el('div','lk-label', esc(it.name)));
    const bar = el('div','lk-bar');
    BANDS.forEach(bd => {
      const c = bd.vals.reduce((a, v) => a + it.dist[v], 0);
      if (!c) return;
      const seg = el('div','lk-seg'); seg.style.width = (100 * c / it.n) + '%'; seg.style.background = bd.color;
      seg.title = `${bd.label}: ${c} of ${it.n}`;
      bar.appendChild(seg);
    });
    row.appendChild(bar);
    row.appendChild(el('div','lk-mean', it.n ? `mean <b>${it.mean.toFixed(1)}</b> · ${pct(it.high, it.n)}% 5–7${it.na ? ` · ${it.na} n/a` : ''}` : `${it.na} n/a`));
    container.appendChild(row);
  });
  const top = stats.find(s => s.n);
  if (top) renderInsight(container, `<b>“${esc(top.short || top.name)}”</b> is the most frustrating, with a mean of <b>${top.mean.toFixed(1)} / 7</b>; ${pct(top.high, top.n)}% of the ${top.n} ${who} who rated it gave 5 or higher.`);
}

function renderHeatmap(container, rowsData, cols, colLabel){

function pmMeans(rows){ return likertStats(pmItems(false), rows).filter(s => s.n); }
function wouldPay(r){ return hasVal(r.wtp_ai) && !['notsure','not_my_call'].includes(r.wtp_ai) ? r.wtp_ai !== '0' : null; }
function shareOf(rows, fn){ const v = rows.map(fn).filter(x => x !== null && x !== undefined); return v.length ? { yes: v.filter(Boolean).length, n: v.length } : null; }
function topAiTask(rows){

  return c.length ? { name: c[0].name, count: c[0].count, n: who.length } : null;

function medianBand(rows, field, order){
  const v = rows.map(r => r[field]).filter(x => order.includes(x)).sort((a, b) => order.indexOf(a) - order.indexOf(b));

}

      days.forEach((k, i) => { if (i % every === 0) mk('text', { x: X(i), y: H - 8, 'text-anchor': 'middle' }, dl(k)); });
      series.slice().reverse().forEach(t => {

        days.forEach((k, i) => { const r = mk('rect', { class: 'pt ' + t, x: (X(i) - 3.5).toFixed(1), y: (Y(vals(k)[t]) - 3.5).toFixed(1), width: 7, height: 7 });

function answerRows(s){
  const out = [];
  const add = (q, v) => { if (hasVal(v)) out.push([q, v]); };
  const L1 = (f, v) => Array.isArray(v) ? v.map(x => lab(f, x, s.source)) : lab(f, v, s.source);
  ['workplace','team_size','role','country','years_operating','emp_role'].forEach(f => add(Q[f], s[f] && L1(f, s[f])));
  add('Other title', s.emp_role_other);
  ['parallel_projects','project_runner','pm_meaning'].forEach(f => add(Q[f], s[f] && L1(f, s[f])));
  add(Q.pm_meaning_text, s.pm_meaning_text);
  const ratings = (items) => items.filter(it => hasVal(s[it.field])).map(it => `${it.name}: ${s[it.field] === 'na' ? 'not part of our work' : s[it.field] + ' / 7'}`);
  add(isEmp(s) ? Q.pain_emp : Q.pain_owner, ratings(areaItems(isEmp(s))));
  add(Q.pain_other, s.pain_other);
  add(Q.strategic_decision_types, s.strategic_decision_types && L1('strategic_decision_types', s.strategic_decision_types));
  add('Other strategic decision', s.strategic_decision_other);
  add(Q.pm, ratings(PMI.map(p => ({ field: p.key, name: fx((isEmp(s) && p.emp) || p.label, s.source) }))));
  s.deepDives.forEach(d => add(`Deep dive ${d.n}: ${areaName(d.key, s.source, isEmp(s))}`, [
    d.handler && 'Handled by: ' + lab('handler', d.handler), d.hours && 'Hours per week: ' + lab('hours', d.hours),
    d.tool && 'Uses today: ' + lab('current_tool', d.tool), d.fit && `How well it works: ${d.fit} / 7`].filter(Boolean)));
  add(Q.bottlenecks, s.bottlenecks && L1('bottlenecks', s.bottlenecks)); add('Other slow-down', s.bottlenecks_other);
  add(Q.ai_tasks, s.ai_tasks && L1('ai_tasks', s.ai_tasks)); add('Other AI tasks', s.ai_tasks_other);
  add(Q.ai_auto, TASKS.filter(t => hasVal(s['ai_auto_' + t.id])).map(t => `${t.short}: ${(AUTO.find(a => a.id === s['ai_auto_' + t.id]) || { l: s['ai_auto_' + t.id] }).l}`));
  add(Q.tools_used, s.tools_used && L1('tools_used', s.tools_used)); add('Other tools', s.tools_other);
  add(Q.spend_pm_monthly, s.spend_pm_monthly && lab('spend', s.spend_pm_monthly)); add(Q.spend_ai_monthly, s.spend_ai_monthly && lab('spend', s.spend_ai_monthly));
  add(Q.wtp_ai, s.wtp_ai && lab('wtp_ai', s.wtp_ai)); add(Q.wtp_pitch_key, hasVal(s.wtp_ai) ? lab('wtp_pitch_key', s.wtp_pitch_key || 'generic') : null);
  add(Q.day2day, s.day2day && L1('day2day', s.day2day)); add('Something else', s.day2day_other);
  add(Q.heaviest, s.heaviest && lab('heaviest', s.heaviest, s.source)); add(Q.heaviest_note, s.heaviest_note);
  add(Q.communities, s.communities); add(Q.gender, s.gender && lab('gender', s.gender));
  if (s.exit_reason) add('Exited at screening', lab('exit_reason', s.exit_reason));
  return out;
}
function openAnswers(key){
  const s = sessionsAll().find(x => x.source + '|' + x.id === key); if (!s) return;
  const back = el('div','drawer-back'); const d = el('div','drawer'); back.appendChild(d);
  const top = el('div','drawer-top');
  top.appendChild(el('div','', `<div class="label">${esc(srcLabel(s.source))} survey</div><div class="drawer-title">${esc(s.id)}</div>` +
    `<div class="drawer-meta">${s.complete ? 'Completed' : s.screenedOut ? 'Exited at screening' : 'Partly filled'} · started ${esc(fmtTime(s.firstTs))} · ${esc(fmtDur(s.durationSec))}${s.lastScreen ? ' · last screen: ' + esc(SCREEN_LABEL[s.lastScreen] || s.lastScreen) : ''}${s.isTest ? ' · test' : ''}</div>`));
  const x = el('button','reset-btn','Close'); x.type = 'button'; top.appendChild(x); d.appendChild(top);
  const dl = el('dl','answers');
  const rows = answerRows(s);
  rows.forEach(([q, v]) => {
    dl.appendChild(el('dt','', esc(q)));
    dl.appendChild(el('dd','', Array.isArray(v) ? `<ul class="ans-list">${v.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : esc(v)));
  });
  if (!rows.length) dl.appendChild(el('dd','empty-state','No answers saved yet.'));
  d.appendChild(dl);
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  x.addEventListener('click', close); back.addEventListener('click', e => { if (e.target === back) close(); }); document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
}
function renderTabF(main){
  const rows = filtered().slice().sort((a, b) => b.lastTs - a.lastTs);
  const s = section('Responses.', 'One row per person who got past screening, newest first. Open a row to read every answer in form order.');
  main.appendChild(s);
  if (!rows.length){ s.appendChild(el('div','empty-state','No responses in this segment yet.')); return; }
  const wrap = el('div','email-wrap'); const t = el('table','emails');
  t.innerHTML = '<thead><tr><th>Survey</th><th>Status</th><th>Role</th><th>Size</th><th>Country</th><th>Started</th><th>Last screen</th><th>Time</th><th></th></tr></thead>';
  const tb = el('tbody');
  rows.forEach(x => {
    const st = x.complete ? ['', 'Completed'] : ['partial', 'Partly filled'];
    const tr = el('tr');
    tr.innerHTML = `<td><span class="src-tag">${esc(srcLabel(x.source))}</span>${x.isTest ? ' <span class="ins-sub">test</span>' : ''}</td><td><span class="status-dot ${st[0]}"></span>${st[1]}</td>` +
      `<td>${esc(x.role ? (isEmp(x) ? 'Employee' : lab('role', x.role)) : '–')}</td><td>${esc(x.team_size ? lab('team_size', x.team_size) : '–')}</td><td>${esc(x.country || '–')}</td>` +
      `<td class="mono">${esc(fmtTime(x.firstTs))}</td><td>${esc(x.lastScreen ? (SCREEN_LABEL[x.lastScreen] || x.lastScreen) : '–')}</td><td class="mono">${esc(fmtDur(x.durationSec))}</td>`;
    const td = el('td'); const a = el('a','view-link','View answers'); a.href = '#'; a.addEventListener('click', e => { e.preventDefault(); openAnswers(x.source + '|' + x.id); });
    td.appendChild(a); tr.appendChild(td); tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); s.appendChild(wrap);
}

function setHeader(){
  document.getElementById('nextLine').textContent = `The next snapshot is prepared ${REFRESH_LABEL}.`;
  document.getElementById('asofLabel').innerHTML = DATA ? `<span class="sq"></span>Data as of ${esc(fmtTime(DATA.fetchedAt))} · from Formspree` : '<span class="sq"></span>No snapshot loaded';
  const tests = sessionsAll().filter(s => s.isTest).length;
  document.getElementById('testToggleWrap').hidden = !tests;
  document.getElementById('fTests').checked = state.showTests;
  const q = qualified();
  document.getElementById('pageSubtitle').textContent =
    'How small agencies, consulting firms and architecture practices run projects: what project management means to them, where it hurts, and how far they’d trust an AI project manager. ' +
    (DATA ? `${q.length} ${q.length===1?'person':'people'} got past screening across the three surveys (${SRC_ORDER.map(k => `${srcLabel(k)} ${q.filter(s => s.source===k).length}`).join(', ')}).` +
      (tests ? ` ${tests} test session${tests===1?' is':'s are'} ${state.showTests ? 'included' : 'excluded'}.` : '') : '');
}
function render(){
  const main = document.getElementById('main'); main.innerHTML = '';
  setHeader();
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.toggle('active', b.dataset.tab===state.tab); b.setAttribute('aria-selected', b.dataset.tab===state.tab); });
  if (!DATA){
    const c = el('div','conn-state'); c.appendChild(el('h2','','No snapshot in this version'));
    c.appendChild(el('p','','This version of the page was published without data. Run scripts/build_r2_dashboard.py to refresh it.'));
    main.appendChild(c); return;
  }
  fillFilters();
  const v = filtered().length, a = qualified().length;
  document.getElementById('matchCount').innerHTML = filtersActive() ? `<b>${v}</b> of ${a} in view` : `<b>${v}</b> in view`;
  if (state.showTests && sessionsAll().some(s => s.isTest)) main.appendChild(el('div','notice', '<div><b>Test rows are included.</b> Sessions marked as internal tests are shown.</div>'));
  if (state.tab === 'b') renderTabB(main);
  else if (state.tab === 'd') renderTabD(main);
  else if (state.tab === 'f') renderTabF(main);
  else renderTabC(main);
  main.querySelectorAll('.chart-grid:not(.stacked)').forEach(packGrid);
}
const CHART_MIN = 310, CHART_GAP = 18;
function packGrid(g){
  const items = Array.from(g.children);
  const cols = Math.max(1, Math.min(items.length, Math.floor((g.clientWidth + CHART_GAP) / (CHART_MIN + CHART_GAP))));
  if (cols < 2 || items.length < 2) return;
  const colEls = Array.from({ length: cols }, () => el('div','chart-col'));
  g.classList.add('packed'); colEls.forEach(c => g.appendChild(c));
  items.forEach(item => colEls.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).appendChild(item));
}
let resizeTimer = null, lastWidth = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth === lastWidth) return; lastWidth = window.innerWidth; clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (DATA) render(); }, 150); });

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  const sticky = document.querySelector('.controlbar-sticky'); const stuck = sticky && sticky.getBoundingClientRect().top <= 1;
  state.tab = btn.dataset.tab; try { localStorage.setItem('r2_tab', state.tab); } catch(e){}
  render();
  if (stuck){ document.getElementById('main').scrollIntoView({ block: 'start' }); window.scrollBy(0, -sticky.offsetHeight); }
}));
document.querySelectorAll('details.ms').forEach(d => {
  const m = MS[d.dataset.ms], panel = d.querySelector('.ms-panel');
  panel.addEventListener('change', e => {
    const v = e.target.value;
    state[m.key] = e.target.checked ? (m.order || []).filter(x => x === v || state[m.key].includes(x)) : state[m.key].filter(x => x !== v);
    render();
  });
  panel.addEventListener('click', e => { if (e.target.closest('[data-clear]')){ state[m.key] = []; d.open = false; render(); } });
});
document.addEventListener('click', e => { document.querySelectorAll('details.ms[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
document.getElementById('fTests').addEventListener('change', e => { state.showTests = e.target.checked; render(); });
document.getElementById('resetBtn').addEventListener('click', () => { state.sources = []; state.sizes = []; state.countries = []; state.roles = []; render(); });

(function boot(){
  if (SNAPSHOT && Array.isArray(SNAPSHOT.submissions)){
    const t = Date.parse(SNAPSHOT.asOf);
    const merged = mergeSessions(SNAPSHOT.submissions.map(rowFrom));
    DATA = { sessions: merged.sessions, noSession: merged.noSession, fetchedAt: isNaN(t) ? Date.now() : t };
  }
  render();
})();
